apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f /home/blac0817/inet4031-team-2/week-2/docker-compose.yml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: flask
  name: flask
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flask
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f /home/blac0817/inet4031-team-2/week-2/docker-compose.yml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: flask
    spec:
      containers:
        - envFrom:
           - secretRef:
               name: flask-credentials
          image: week-2-flask:latest
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - curl
                - -f
                - http://localhost:5000/health
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          name: flask
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
